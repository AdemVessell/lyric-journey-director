<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} — the journey</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="journey.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body><main>
<div class="head">
  <div><span class="eyebrow">A LYRIC JOURNEY · TEST CUT</span><h1>{{TITLE}}</h1></div>
  <button id="fullscreen" aria-label="Enter fullscreen">⛶ <span>FULLSCREEN</span></button>
</div>
<div class="screen" id="screen">
  <canvas id="stage" width="1920" height="1080" aria-label="A camera journey through the song's world, with its lyrics placed in it"></canvas>
  <button id="start" aria-label="Play"><span>▶</span><small>PLAY</small></button>
  <div id="loading">Building the world…</div>
</div>
<div class="transport">
  <button id="play" aria-label="Play or pause">▶</button>
  <span id="time">0:00</span>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Seek">
  <span id="duration">0:00</span>
  <button id="sound" aria-label="Mute or unmute">◖))</button>
</div>
<div class="foot"><span id="readout">SPACE PLAY</span><span>TIMING: timing.json · SUNG ONSETS</span></div>
</main>
<audio id="audio" preload="auto" src="../assets/song.wav"></audio>
<script type="module" src="src/main.js"></script></body></html>
